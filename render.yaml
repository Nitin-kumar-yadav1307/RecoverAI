# Render blueprint — https://render.com/docs/blueprint-spec
# Deploys the RecoverAI NestJS API with a PostgreSQL database.
# push to GitHub and create a "Blueprint" from this file in the Render dashboard.

services:
  - type: web
    name: recoverai-api
    runtime: node
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @recoverai/api start
    preDeployCommand: pnpm db:migrate:deploy
    healthCheckPath: /auth/me
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: DATABASE_URL
        fromDatabase:
          name: recoverai-db
          property: connectionString
      - key: API_PORT
        value: 3001
      - key: AUTH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_PROVIDER
        value: razorpay
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: "RecoverAI <onboarding@resend.dev>"

databases:
  - name: recoverai-db
    plan: free
    databaseName: recoverai
    user: recoverai